[platformio]
default_envs = nanoatmega328_usb

[env]
lib_ldf_mode = chain+
monitor_speed = 115200
extra_scripts = pre:scripts/platformio_cxx_only_flags.py

[env:nanoatmega328]
; RF24-enabled Nano profile retained from the inherited firmware tree.
; It currently exceeds Nano flash under the present toolchain/dependency set.
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps =
  arduino-libraries/Servo @ 1.2.2
build_flags =
  -Wall
  -Wextra
  -Wshadow
  -Wconversion
  -Wsign-conversion
  -flto
  -fmerge-all-constants
  -fno-exceptions
  -fno-rtti
  -fno-threadsafe-statics
  -fno-use-cxa-atexit
  -mcall-prologues
  -Wl,--relax
  -Wl,--gc-sections
  -DCE_CUBE_ENABLE_RF24=1
  -DCE_CUBE_ENABLE_PRESSURE=1
  -DCE_CUBE_ENABLE_PROTOCOL_INFO=0
  -DCE_CUBE_ENABLE_LEGACY_V1_COMMANDS=0
  -DCE_CUBE_ENABLE_CURRENT=1
  -DCE_CUBE_ENABLE_REPLENISH=1

[env:nanoatmega328_usb]
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps =
  arduino-libraries/Servo @ 1.2.2
build_flags =
  -Wall
  -Wextra
  -Wshadow
  -Wconversion
  -Wsign-conversion
  -flto
  -fmerge-all-constants
  -fno-exceptions
  -fno-rtti
  -fno-threadsafe-statics
  -fno-use-cxa-atexit
  -mcall-prologues
  -Wl,--relax
  -Wl,--gc-sections
  -DCE_CUBE_ENABLE_RF24=0
  -DCE_CUBE_ENABLE_PRESSURE=1
  -DCE_CUBE_ENABLE_PROTOCOL_INFO=0
  -DCE_CUBE_ENABLE_LEGACY_V1_COMMANDS=0
  -DCE_CUBE_ENABLE_CURRENT=1
  -DCE_CUBE_ENABLE_REPLENISH=1

[env:native]
platform = native
test_framework = unity
build_flags =
  -Wall
  -Wextra
  -Wshadow
  -Wconversion
  -Wsign-conversion
  -fmerge-all-constants
  -std=c++17
  -DCE_CUBE_ENABLE_CURRENT=1
  -DCE_CUBE_ENABLE_REPLENISH=1
